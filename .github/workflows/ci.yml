# Continuous integration for the Financial Message Studio.
#
# The Makefile is the source of truth. Every job below runs `make …`; the YAML adds only
# what a runner needs that a laptop does not — the browser's OS libraries, and an explicit
# base ref so `git diff --check` has a range to check. Reproducing any job locally means
# running the same make target, which is the point.
#
# Branch protection: mark **Required Checks** as the required status check for `main`.
# That job name is deliberately stable; changing it would silently disable the gate.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# A newer commit on the same pull request makes the older run irrelevant, so cancel it.
# Runs on `main` are never cancelled: the default branch would be left with no verified
# result, which is worse than paying for a duplicate run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "22"

jobs:
  required:
    # Stable name — branch protection depends on it. Do not rename casually.
    name: Required Checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          # `git diff --check` needs the base commit to compare against; a shallow clone
          # does not have it.
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: make install

      - name: make check
        # ruff, eslint, mypy --strict, tsc, the backend suite, the coverage gate and the
        # demo-pack gate. One target, so CI and a laptop cannot verify different things.
        run: make check

      - name: make secret-scan
        run: make secret-scan

      - name: git diff --check
        # A bare `git diff --check` compares the worktree to the index and is always clean
        # on a runner. Checking the pull request's own range is the assertion worth making.
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --check "origin/${{ github.base_ref }}...HEAD"
          else
            git diff --check "${{ github.event.before }}..HEAD" 2>/dev/null \
              || git show --check HEAD
          fi

  clean-clone:
    name: Clean Clone
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      # Deliberately no dependency cache. This job exists to prove a new machine can start
      # from git-tracked files alone, and a cached wheel would hide exactly the defect that
      # motivated it: `lxml-stubs==0.6.0`, a pin that does not exist upstream and that broke
      # `make install` for everyone who had never run it. Speed is not the point here.
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          # setup-node v5+ can auto-cache package managers. Keep this job cache-free.
          package-manager-cache: false

      - name: Confirm the checkout carries no local machine state
        # If any of these exist, the job below would not be proving what it claims to.
        run: |
          for path in .env backend/.venv frontend/node_modules backend/data frontend/.next; do
            if [ -e "$path" ]; then
              echo "::error::$path is present in a fresh checkout; this job cannot prove a clean start"
              exit 1
            fi
          done
          echo "No .env, virtualenv, node_modules, database or build cache. Starting from git alone."

      - name: make install
        run: make install

      - name: make migrate
        # The step that failed on every clean clone until the directory a file-backed SQLite
        # database lives in was created from somewhere alembic reaches.
        run: make migrate

      - name: make check
        run: make check

  mt-prowide-source:
    name: MT Prowide Source
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install backend dependencies
        # No Node install here. This job exists only for the build-time Prowide extractor,
        # and the FastAPI runtime must not need Java, Maven, Gradle or this cache.
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/python -m pip install --upgrade pip
          backend/.venv/bin/pip install -r backend/requirements-dev.txt

      - name: make verify-prowide-mt-source
        run: make verify-prowide-mt-source

  e2e:
    name: Browser E2E
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: make install

      - name: Install the browser's system libraries
        # `make install` installs the browser but not its OS dependencies, because
        # `--with-deps` needs sudo and would be wrong to run on a developer's machine.
        # A runner is the one place it belongs.
        run: cd frontend && npx playwright install --with-deps chromium

      - name: make e2e
        # Playwright owns both servers. `reuseExistingServer` is false whenever CI is set,
        # so this can never adopt a process it did not start.
        run: make e2e

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          # The report, traces and screenshots. Everything they contain is the synthetic
          # demonstration data already committed to `demo/`: no .env is ever created in CI,
          # the database is in-memory, and no credential reaches these paths.
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
          if-no-files-found: ignore

  docker:
    name: Docker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: docker compose config
        run: docker compose config --quiet

      - name: docker compose build
        # Verifies reproducible image construction only. Nothing is tagged, pushed or run.
        run: docker compose build

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: make install

      - name: make audit
        # pip-audit and `npm audit --omit=dev`, the repository's existing target.
        #
        # Kept out of Required Checks on purpose: this asks the world whether a dependency
        # has a newly published advisory, so it can turn red overnight for a reason nobody's
        # change caused. A required gate should fail only for something in the diff. Promote
        # this to required once the team is happy to treat a new CVE as merge-blocking.
        run: make audit
