services:
  backend:
    build:
      context: ./backend
    environment:
      APP_ENV: development
      DATABASE_URL: sqlite:////app/data/securities_studio.db
      REPORT_DIRECTORY: /app/data/reports
      FRONTEND_ORIGIN: http://localhost:${FRONTEND_PORT:-3000},http://127.0.0.1:${FRONTEND_PORT:-3000}
      AI_PROVIDER: ${AI_PROVIDER:-disabled}
      AI_MODE: ${AI_MODE:-optional}
      AI_RATE_LIMIT_REQUESTS_PER_MINUTE: ${AI_RATE_LIMIT_REQUESTS_PER_MINUTE:-30}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      OPENROUTER_PRIMARY_MODEL: ${OPENROUTER_PRIMARY_MODEL:-openai/gpt-5.4-mini}
      OPENROUTER_ESCALATION_MODEL: ${OPENROUTER_ESCALATION_MODEL:-openai/gpt-5.4}
      OPENROUTER_ESCALATION_ENABLED: ${OPENROUTER_ESCALATION_ENABLED:-true}
      OPENROUTER_HTTP_REFERER: ${OPENROUTER_HTTP_REFERER:-}
      OPENROUTER_APP_TITLE: ${OPENROUTER_APP_TITLE:-Intelligent SWIFT Message Engineering Platform}
      OPENROUTER_REQUIRE_PARAMETERS: ${OPENROUTER_REQUIRE_PARAMETERS:-true}
      OPENROUTER_ALLOW_PROVIDER_FALLBACKS: ${OPENROUTER_ALLOW_PROVIDER_FALLBACKS:-true}
      OPENROUTER_DATA_COLLECTION: ${OPENROUTER_DATA_COLLECTION:-deny}
      OPENROUTER_ZDR_REQUIRED: ${OPENROUTER_ZDR_REQUIRED:-true}
      OPENROUTER_TIMEOUT_SECONDS: ${OPENROUTER_TIMEOUT_SECONDS:-30}
      OPENROUTER_CONNECT_TIMEOUT_SECONDS: ${OPENROUTER_CONNECT_TIMEOUT_SECONDS:-5}
      OPENROUTER_OPERATION_TIMEOUT_SECONDS: ${OPENROUTER_OPERATION_TIMEOUT_SECONDS:-45}
      OPENROUTER_MAX_RETRIES: ${OPENROUTER_MAX_RETRIES:-2}
      OPENROUTER_MAX_INPUT_CHARS: ${OPENROUTER_MAX_INPUT_CHARS:-6000}
      OPENROUTER_MAX_OUTPUT_TOKENS: ${OPENROUTER_MAX_OUTPUT_TOKENS:-1200}
      OPENROUTER_CONFIDENCE_THRESHOLD: ${OPENROUTER_CONFIDENCE_THRESHOLD:-0.80}
      OPENROUTER_DAILY_REQUEST_BUDGET: ${OPENROUTER_DAILY_REQUEST_BUDGET:-}
      OPENROUTER_DAILY_TOKEN_BUDGET: ${OPENROUTER_DAILY_TOKEN_BUDGET:-}
      OPENROUTER_LOG_CONTENT: "false"
      OPENROUTER_RETRY_BASE_SECONDS: ${OPENROUTER_RETRY_BASE_SECONDS:-0.25}
      OPENROUTER_RETRY_MAX_SECONDS: ${OPENROUTER_RETRY_MAX_SECONDS:-3}
      OPENROUTER_CIRCUIT_FAILURE_THRESHOLD: ${OPENROUTER_CIRCUIT_FAILURE_THRESHOLD:-5}
      OPENROUTER_CIRCUIT_COOLDOWN_SECONDS: ${OPENROUTER_CIRCUIT_COOLDOWN_SECONDS:-30}
      AI_CACHE_ENABLED: ${AI_CACHE_ENABLED:-true}
      AI_CACHE_HMAC_SECRET: ${AI_CACHE_HMAC_SECRET:-}
      AI_CACHE_KEY_VERSION: ${AI_CACHE_KEY_VERSION:-v1}
      AI_CACHE_INTENT_TTL_SECONDS: ${AI_CACHE_INTENT_TTL_SECONDS:-2592000}
      AI_CACHE_EXPLANATION_TTL_SECONDS: ${AI_CACHE_EXPLANATION_TTL_SECONDS:-7776000}
      AI_CACHE_VALIDATION_TTL_SECONDS: ${AI_CACHE_VALIDATION_TTL_SECONDS:-2592000}
      AI_CACHE_L1_MAX_ENTRIES: ${AI_CACHE_L1_MAX_ENTRIES:-256}
      AI_CACHE_STAMPEDE_WAIT_SECONDS: ${AI_CACHE_STAMPEDE_WAIT_SECONDS:-45}
      AI_CACHE_KNOWLEDGE_VERSION: ${AI_CACHE_KNOWLEDGE_VERSION:-KB_2026_08_05_V2}
      AI_CACHE_TAXONOMY_VERSION: ${AI_CACHE_TAXONOMY_VERSION:-WORKFLOW_TAXONOMY_V1}
      AI_CACHE_ADMIN_ENABLED: "false"
      DEMO_RESET_ENABLED: "true"
      DEMO_RESET_KEY: ${DEMO_RESET_KEY:-}
      REAL_DATA_MODE_ENABLED: ${REAL_DATA_MODE_ENABLED:-false}
      AUTH_MODE: ${AUTH_MODE:-development}
      SESSION_HMAC_SECRET: ${SESSION_HMAC_SECRET:-}
      SESSION_SECURE_COOKIES: ${SESSION_SECURE_COOKIES:-false}
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:-}
      DATA_ENCRYPTION_KEY_ID: ${DATA_ENCRYPTION_KEY_ID:-local-v1}
      DATA_RETENTION_DAYS: ${DATA_RETENTION_DAYS:-90}
      SUBMISSION_MODE: ${SUBMISSION_MODE:-disabled}
      PRODUCTION_SUBMISSION_ENABLED: "false"
      MOCK_UAT_CONNECTOR_ENABLED: ${MOCK_UAT_CONNECTOR_ENABLED:-false}
      EXTERNAL_VALIDATION_REQUIRED_FOR_SUBMISSION: "true"
      FIN_EXPORT_ENABLED: ${FIN_EXPORT_ENABLED:-true}
      RJE_EXPORT_ENABLED: ${RJE_EXPORT_ENABLED:-false}
      # Phase 6: organisation AI endpoint and the local knowledge base. Names pass through
      # from the host environment; the image carries no key and no licensed source. The
      # knowledge base stays disabled unless KNOWLEDGE_MODE is set, and its sources must be
      # mounted read-only at the path KNOWLEDGE_SOURCE_DIR names.
      AI_ENDPOINT: ${AI_ENDPOINT:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_CHAT_DEPLOYMENT: ${AI_CHAT_DEPLOYMENT:-}
      AI_API_VERSION: ${AI_API_VERSION:-}
      EMBEDDINGS_DEPLOYMENT: ${EMBEDDINGS_DEPLOYMENT:-}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-disabled}
      KNOWLEDGE_MODE: ${KNOWLEDGE_MODE:-disabled}
      KNOWLEDGE_SOURCE_DIR: ${KNOWLEDGE_SOURCE_DIR:-/app/knowledge-sources}
      KNOWLEDGE_DB_PATH: /app/data/knowledge/knowledge.sqlite3
      KNOWLEDGE_PACK_DIR: /app/data/knowledge/packs
      KNOWLEDGE_SOURCE_CACHE_DIR: /app/data/knowledge/source-cache
      KNOWLEDGE_AUTO_SYNC_ON_START: ${KNOWLEDGE_AUTO_SYNC_ON_START:-false}
      KNOWLEDGE_EXTERNAL_EMBEDDING_ALLOWED: ${KNOWLEDGE_EXTERNAL_EMBEDDING_ALLOWED:-false}
      KNOWLEDGE_EXTERNAL_LLM_ALLOWED: ${KNOWLEDGE_EXTERNAL_LLM_ALLOWED:-false}
      KNOWLEDGE_AI_PROVIDER: ${KNOWLEDGE_AI_PROVIDER:-disabled}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - studio-data:/app/data
      - ./swiftKnowledgeBase:/app/knowledge-sources:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/ready')"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      args:
        # 127.0.0.1, not localhost: the browser resolves localhost to ::1 first on a
        # dual-stack machine, and an occasional request then dies with ECONNREFUSED, which
        # reaches fetch() as a bare network error. An address needs no resolving.
        NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:${BACKEND_PORT:-8000}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:3000"

volumes:
  studio-data:
