- restrictionId: DEMO-MKT-SESE023-SETTLEMENT-CONDITION
  field:
    format: MX
    path: /Document/SctiesSttlmTxInstr/SttlmParams/SttlmTxCond/Cd
  codes:
  - NOMC
  - PART
  - CLEN
  finding:
    message: This market accepts only the settlement conditions NOMC, PART and CLEN.
    suggestion: Choose NOMC, PART or CLEN.
