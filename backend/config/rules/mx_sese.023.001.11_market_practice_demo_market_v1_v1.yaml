rules:
- ruleId: DEMO-MKT-SESE023-CREDIT-DEBIT-WITH-AMOUNT
  title: Credit or debit indicator accompanies a settlement amount
  severity: ERROR
  when:
    field:
      format: MX
      path: /Document/SctiesSttlmTxInstr/SttlmAmt/Amt
    operator: EXISTS
  assert:
    field:
      format: MX
      path: /Document/SctiesSttlmTxInstr/SttlmAmt/CdtDbtInd
    operator: EXISTS
  finding:
    message: An instruction carrying a settlement amount must say whether the cash is credited or
      debited.
    suggestion: Add the credit or debit indicator, or remove the amount.
  evidence:
  - sourceId: SYNTH-DEMO-MARKET-V1
    segmentId: SYNTH-DEMO-MARKET-V1#S0004
    sourceLocation: synthetic-demo-market-v1.md
    sourceVersion: '1.0'
    sourceChecksum: sha256:9c364cdb5291f9ccfd0fc30991ca61f1c3f4c7f745805e731620c274487756c8
    segmentHash: sha256:8d159c59ff13fcea4af98cdf88badd1f986abd81dc538428bffbf10eacb6bcfd
    excerptHash: sha256:8d159c59ff13fcea4af98cdf88badd1f986abd81dc538428bffbf10eacb6bcfd
    excerpt: 'Where an instruction carries a settlement amount, the credit or debit indicator must
      be

      present so that the direction of the cash movement is explicit.'
    heading: 3 Credit and debit indicator
    lineStart: 21
    lineEnd: 22
