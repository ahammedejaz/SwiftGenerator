# SYNTHETIC EVALUATION CORPUS.
#
# Written for this repository to measure rule extraction. Every paragraph here is
# invented: none of it is a standard, a market practice, or derived from any licensed
# document, and none of it is installed as a rule anywhere.
#
# Each case pairs a paragraph with the reading a careful person would take from it,
# and with the behaviours the offline run stages for the two extraction passes.
#
format: MX
messageType: sese.023
