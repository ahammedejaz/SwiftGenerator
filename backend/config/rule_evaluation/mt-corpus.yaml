# SYNTHETIC MT EVALUATION CORPUS.
#
# Written for this repository to measure the Phase 5A MT semantic-rule ingestion
# foundation. Every paragraph here is invented and marked synthetic. None of it is a
# SWIFT standard, MyStandards content, a market practice, a client rule, or derived from a
# licensed document. None of it is installed as a runtime rule.
#
