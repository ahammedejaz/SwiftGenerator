    qualifier: STST
    businessPath: statementStructure
    displayName: Statement Structure
    businessMeaning: Declares that this statement contains penalty information.
    technicalMeaning: Statement structure type indicator STST with code PENA.
    whyUsed: Deterministically requires the MT537 penalties sequence rather than transaction/status sequences.
    businessQuestion: Does this statement report penalties?
    missingImpact: The penalties sequence would conflict with the selected structure.
    supportedOptions: [H]
    codeList: STATEMENT_STRUCTURE
    allowedCodes: []
    formatExplanation: Qualified option H indicator with PENA.
    exampleValues: [{value: PENA, synthetic: true, explanation: Penalty structure code.}]
    searchTerms: [22H, STST, PENA, structure]

  - <<: *base
    fieldTag: 97A
    qualifier: SAFE
    businessPath: safekeepingAccount
    displayName: Safekeeping Account
    businessMeaning: Identifies the synthetic account covered by the statement.
    technicalMeaning: Mandatory MT537 general-information safekeeping account.
    whyUsed: Scopes reported penalties to the configured account relationship.
    businessQuestion: Which synthetic safekeeping account does this statement cover?
    missingImpact: The statement account scope would be missing.
    supportedOptions: [A]
    codeList: null
    allowedCodes: []
