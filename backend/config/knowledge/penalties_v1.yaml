    standardsRelease: PUBLIC_UHB_REVIEW_2026_08_05
    knowledgeVersion: KB_2026_08_05_V1
    source: &source
      sourceType: OFFICIAL_ISO_15022
      sourceReference: ISO15022-UHB-MT537-PENALTIES-FORMAT-REVIEWED-2026-08-05
      reviewStatus: VERIFIED
      reviewedAt: 2026-08-05
      reviewedBy: SYSTEM_IMPORT_OR_APPROVED_ROLE
    searchTerms: [MT537, page, penalty statement]

  - <<: *base
    fieldTag: 20C
    qualifier: SEME
    businessPath: statementReference
    displayName: Statement Reference
    businessMeaning: Uniquely identifies the synthetic MT537 penalty statement.
    technicalMeaning: Sender message reference in MT537 general information.
    whyUsed: Supports statement retrieval, uniqueness, and audit.
    businessQuestion: What unique synthetic reference identifies this statement?
    missingImpact: The statement cannot be generated or audited.
    supportedOptions: [C]
    codeList: null
    allowedCodes: []
    formatExplanation: Qualified option C reference, at most 16 characters in this subset.
    exampleValues: [{value: PENASTMT0001, synthetic: true, explanation: Synthetic statement reference.}]
    searchTerms: [SEME, statement reference]

  - <<: *base
    fieldTag: 23G
    businessPath: function
    displayName: Penalty Function
    businessMeaning: Identifies this MT537 as a penalty statement operation.
    technicalMeaning: Function field set to PENA for the penalty structure.
    whyUsed: Activates the penalty-specific statement structure in this subset.
    businessQuestion: Is this a new penalty statement?
    missingImpact: The penalty structure would not be identified.
    supportedOptions: [G]
    codeList: PENALTY_FUNCTION
    allowedCodes: []
    formatExplanation: Four-character PENA function code.
    exampleValues: [{value: PENA, synthetic: true, explanation: Penalty statement function.}]
    searchTerms: [23G, PENA, function]

  - <<: *base
    fieldTag: 98A
    qualifier: STAT
    businessPath: statementDate
    displayName: Statement Date
    businessMeaning: States the date on which the penalty statement is based.
    technicalMeaning: Option A date field with qualifier STAT in sequence A.
    whyUsed: Establishes the reporting date for the statement.
    businessQuestion: What is the statement date?
