  - <<: *notification
    messageTypes: [MT568]
    sequencePath: C
    fieldTag: 70E
    qualifier: ADTX
    businessPath: narrative
    displayName: Additional Text
    businessMeaning: Provides sanitised additional event text that does not replace structured fields.
    technicalMeaning: ADTX narrative in the mandatory additional-information sequence.
    whyUsed: Communicates bounded supplementary information for the related event.
    businessQuestion: What supplementary synthetic text should accompany this event?
    missingImpact: The narrative message would contain no additional information.
    supportedOptions: [E]
    codeList: null
    allowedCodes: []
    formatExplanation: At most 350 supported characters; raw-message fragments and controls are rejected.
    lifecycleImpact: Associates supplementary text with the event without changing structured data.
    searchTerms: [70E, ADTX, narrative, additional text]
