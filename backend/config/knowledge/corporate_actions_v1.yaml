  - <<: *cash
    fieldTag: 98A
    qualifier: POST
    businessPath: paymentDate
    displayName: Posting Date
    businessMeaning: States the date on which the cash movement was posted.
    technicalMeaning: Mandatory POST date in the CASHMOVE subsequence.
    whyUsed: Dates the confirmed cash movement.
    businessQuestion: On what date was the cash posted?
    missingImpact: The cash confirmation would lack its required posting date.
