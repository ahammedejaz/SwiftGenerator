    exampleValues: [{value: SYNTHREF000001, synthetic: true, explanation: Demonstration reference only.}]
    commonMistakes: [Reusing a reference, Exceeding the configured profile length]
    dependsOn: []
    requiredWith: []
    conflictsWith: []
    relatedFields: [PREV]
    lifecycleImpact: Statuses, confirmations, cancellations, and commands link back to business references.
    ruleLayer: BASE_STANDARD
    standardsRelease: PUBLIC_UHB_REVIEW_2026_08_05
    knowledgeVersion: KB_2026_08_05_V1
    source: &settlement_source
      sourceType: OFFICIAL_ISO_15022
      sourceReference: ISO15022-UHB-CATEGORY5-MT540-MT548-REVIEWED-2026-08-05
      reviewStatus: VERIFIED
      reviewedAt: 2026-08-05
      reviewedBy: SYSTEM_IMPORT_OR_APPROVED_ROLE
    searchTerms: [SEME, sender reference, message reference]

  - <<: *instruction_seme
    qualifier: PREV
    businessPath: relatedReference
    displayName: Previous Message Reference
    businessMeaning: Identifies the earlier sender-side message to which this instruction is linked.
    technicalMeaning: Qualified reference field using PREV for a previously sent message.
    whyUsed: Provides deterministic linkage for supported cancellation and replacement flows.
    businessQuestion: Which previous instruction reference should this message link to?
    missingImpact: A configured cancellation or replacement cannot be correlated without it.
    presence: CONDITIONAL
    conditionExpression: FUNCTION_REQUIRES_PREVIOUS_REFERENCE
    conditionExplanation: Required when the selected supported function and profile require a previous message.
    commonMistakes: [Using the new message reference instead of the original reference]
    relatedFields: [SEME]
    searchTerms: [PREV, previous reference, cancellation linkage]

  - <<: *instruction_seme
    qualifier: COMM
    businessPath: clientReference
    displayName: Common or Client Reference
    businessMeaning: Carries the configured client-side common reference used by this demonstration profile.
    technicalMeaning: Qualified reference field using COMM in the supported composer subset.
    whyUsed: Supports client reconciliation when the selected profile requires a client reference.
    businessQuestion: What synthetic client reference should accompany this message?
    missingImpact: A profile that mandates the client reference will block generation when it is missing.
