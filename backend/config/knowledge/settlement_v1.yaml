  # Settlement parties.
  #
  # Two decisions are configured here, and both were previously wrong.
  #
  # 1. Which agent is *required*. Reconciled against this repository's own ISO 20022
  #    definition of the same business message, sese.023.001.11, which states it plainly:
  #    DlvrgSttlmPties is "required when the account owner is receiving securities", and
  #    RcvgSttlmPties is "required when the account owner is delivering securities". So a
  #    receive instruction names the delivering agent and a delivery names the receiving
  #    agent. The other chain is not forbidden — sese.023 marks both CONDITIONAL — so it
  #    stays available as an optional additional party rather than being removed.
  #
  # 2. How a party is identified. Option P carries a BIC on its own; option R carries a
  #    data source scheme and a proprietary identifier. They are alternatives for the same
  #    business party, which is what `choiceGroup` says, and writing a BIC into option R is
  #    the specific mistake this pairing exists to prevent.

  - &pset_bic
    messageTypes: [MT540, MT541, MT542, MT543]
    workflowModule: SETTLEMENT
    sequencePath: E
    fieldTag: 95P
    qualifier: PSET
    businessPath: settlement.placeOfSettlement
    displayName: Place of Settlement
    businessMeaning: >-
      Where the securities actually settle — normally the central securities depository that
      holds them. Both sides must name the same place or the instructions cannot match.
    technicalMeaning: Settlement party field carrying the place of settlement as a BIC, option P.
    whyUsed: Routes the instruction to the settlement location and lets the two sides match.
    businessQuestion: Where should the securities settle?
    missingImpact: The instruction cannot be routed to a settlement location.
    presence: CONDITIONAL
    conditionExpression: PROFILE_SETTLEMENT_PARTY_RULE
    conditionExplanation: Both demonstration profiles require a place of settlement on a generated settlement instruction. Identify it by BIC, or switch to the proprietary form.
    supportedOptions: [P]
    allowedCodes: []
    choiceGroup: SETTLEMENT-E-PSET/95P
    maxLength: 11
    formatExplanation: A BIC — eight or eleven characters. The format is checked; whether the BIC is registered is not.
    exampleValues: [{value: DEMOGB2LXXX, synthetic: true, explanation: 'Synthetic depository BIC: correctly shaped, not registered with SWIFT.'}]
    commonMistakes: [Entering a proprietary code here instead of a BIC, Treating the place of settlement as a counterparty account]
    dependsOn: []
    requiredWith: []
    conflictsWith: []
    relatedFields: [DEAG, REAG]
    lifecycleImpact: Reused when correlating settlement responses.
    ruleLayer: BASE_STANDARD
    standardsRelease: PUBLIC_UHB_REVIEW_2026_08_05
    knowledgeVersion: KB_2026_08_05_V1
    source: *settlement_source
    searchTerms: [PSET, 95P, place of settlement, settlement venue, CSD, depository, BIC]

  - <<: *pset_bic
    fieldTag: 95R
    supportedOptions: [R]
    choiceGroup: SETTLEMENT-E-PSET/95R
    maxLength: 43
    technicalMeaning: Settlement party field carrying the place of settlement as a proprietary identifier, option R.
    conditionExplanation: Use this instead of the BIC form when the place of settlement is identified by a scheme code rather than a BIC.
    formatExplanation: A data source scheme, then a slash, then the identifier — for example CSD/DEMOPSET01.
    exampleValues: [{value: CSD/DEMOPSET01, synthetic: true, explanation: Synthetic place of settlement under a demonstration scheme.}]
    commonMistakes: [Entering a BIC here — use the BIC form instead, Omitting the data source scheme in front of the identifier]
    searchTerms: [PSET, 95R, place of settlement, settlement venue, CSD, depository, proprietary, data source scheme]

  # ---- Delivering agent: required on a receive instruction, optional on a delivery. ----

  - &deag_bic
    messageTypes: [MT540, MT541]
    workflowModule: SETTLEMENT
    sequencePath: E
    fieldTag: 95P
    qualifier: DEAG
    businessPath: settlement.deliveringAgent
    displayName: Delivering Agent
    businessMeaning: >-
      The party delivering the securities — the counterparty side of a receipt. Naming it is
      how the receiving side's instruction finds the delivering side's instruction to match
      against.
    technicalMeaning: Settlement party field carrying the delivering agent as a BIC, option P.
    whyUsed: Identifies where the securities are coming from so the two sides can match.
    businessQuestion: Which agent is delivering the securities?
    missingImpact: The instruction names no counterparty chain, so nothing can match it.
    presence: MANDATORY
    supportedOptions: [P]
    allowedCodes: []
    choiceGroup: SETTLEMENT-E-DEAG/95P
    maxLength: 11
    conditionExplanation: Required on a receive instruction, because the chain that delivers the securities has to be identified.
    formatExplanation: A BIC — eight or eleven characters. The format is checked; whether the BIC is registered is not.
    exampleValues: [{value: DEMODEAGXXX, synthetic: true, explanation: 'Synthetic delivering agent BIC: correctly shaped, not registered with SWIFT.'}]
    commonMistakes: [Entering a proprietary code here instead of a BIC, Giving the place of settlement instead of the delivering agent]
    dependsOn: []
    requiredWith: []
    conflictsWith: []
    relatedFields: [PSET, REAG]
    lifecycleImpact: Settlement responses stay consistent with the original party chain.
    ruleLayer: BASE_STANDARD
    standardsRelease: PUBLIC_UHB_REVIEW_2026_08_05
    knowledgeVersion: KB_2026_08_05_V1
    source: *settlement_source
    searchTerms: [DEAG, 95P, delivering agent, counterparty, BIC]

  - <<: *deag_bic
    fieldTag: 95R
    supportedOptions: [R]
    choiceGroup: SETTLEMENT-E-DEAG/95R
    maxLength: 43
    technicalMeaning: Settlement party field carrying the delivering agent as a proprietary identifier, option R.
    formatExplanation: A data source scheme, then a slash, then the identifier — for example AGT/DEMODEAG01.
    exampleValues: [{value: AGT/DEMODEAG01, synthetic: true, explanation: Synthetic delivering agent under a demonstration scheme.}]
    commonMistakes: [Entering a BIC here — use the BIC form instead, Omitting the data source scheme in front of the identifier]
    searchTerms: [DEAG, 95R, delivering agent, proprietary, data source scheme]

  - <<: *deag_bic
    messageTypes: [MT542, MT543]
    presence: OPTIONAL
    conditionExplanation: Not required on a delivery — the receiving agent is the required counterparty here. Add it only when the delivering chain also has to be stated.
    relatedFields: [PSET, REAG]

  - <<: *deag_bic
    messageTypes: [MT542, MT543]
