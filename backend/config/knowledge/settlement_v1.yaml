  - <<: *instruction_seme
    qualifier: PREV
    businessPath: relatedReference
    displayName: Previous Message Reference
    businessMeaning: Identifies the earlier sender-side message to which this instruction is linked.
    technicalMeaning: Qualified reference field using PREV for a previously sent message.
    whyUsed: Provides deterministic linkage for supported cancellation and replacement flows.
    businessQuestion: Which previous instruction reference should this message link to?
    missingImpact: A configured cancellation or replacement cannot be correlated without it.
    presence: CONDITIONAL
    conditionExpression: FUNCTION_REQUIRES_PREVIOUS_REFERENCE
    conditionExplanation: Required when the selected supported function and profile require a previous message.
    commonMistakes: [Using the new message reference instead of the original reference]
    relatedFields: [SEME]
    searchTerms: [PREV, previous reference, cancellation linkage]

  - <<: *instruction_seme
