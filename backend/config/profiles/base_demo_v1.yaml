profileId: BASE_DEMO_V1
name: Base Demo Profile
version: 1.0.0
standardsRelease: DEMO_SR2026
status: DEMO
supportedMessageTypes:
  - MT530
  - MT537
  - MT540
  - MT541
  - MT542
  - MT543
  - MT544
  - MT545
  - MT546
  - MT547
  - MT548
  - MT564
  - MT565
  - MT566
  - MT567
  - MT568
defaults:
  function: NEWM
  security.quantity_type: UNIT
allowedCurrencies:
  - USD
  - EUR
  - GBP
requiredFields:
  MT530:
    - sender_reference
    - account.safekeeping_account
    - command.command_type
    - command.original_instruction_reference
    - command.priority
  MT537: []
  # A receipt requires the delivering side; a delivery requires the receiving side. The
  # anchors used to pair MT540 with MT542 and MT541 with MT543, which required both agents
  # on every instruction — so an MT541 demanded a receiving agent it does not need. The
  # other chain remains available as an optional additional party.
  MT540: &receive_instruction
    - direction
    - payment_type
    - sender_reference
    - trade.transaction_type
    - trade.trade_date
    - trade.settlement_date
    - security.identifier
    - security.quantity
    - account.safekeeping_account
    - settlement.place_of_settlement
    - settlement.delivering_agent
  MT541:
    - direction
    - payment_type
    - sender_reference
    - trade.transaction_type
    - trade.trade_date
    - trade.settlement_date
    - security.identifier
    - security.quantity
    - account.safekeeping_account
    - settlement.currency
    - settlement.amount
    - settlement.place_of_settlement
    - settlement.delivering_agent
  MT542: &deliver_instruction
    - direction
    - payment_type
    - sender_reference
    - trade.transaction_type
    - trade.trade_date
    - trade.settlement_date
    - security.identifier
    - security.quantity
    - account.safekeeping_account
    - settlement.place_of_settlement
    - settlement.receiving_agent
  MT543:
    - direction
    - payment_type
    - sender_reference
    - trade.transaction_type
    - trade.trade_date
    - trade.settlement_date
    - security.identifier
    - security.quantity
    - account.safekeeping_account
    - settlement.currency
    - settlement.amount
    - settlement.place_of_settlement
    - settlement.receiving_agent
  MT544: &receive_confirmation
    - direction
    - payment_type
    - sender_reference
    - related_reference
    - security.identifier
    - account.safekeeping_account
    - settlement.place_of_settlement
    - settlement.delivering_agent
    - confirmation.actual_settlement_date
    - confirmation.settled_quantity
    - confirmation.settlement_result
  MT545: &receive_dvp_confirmation
    - direction
    - payment_type
    - sender_reference
    - related_reference
    - security.identifier
    - account.safekeeping_account
    - settlement.currency
    - settlement.place_of_settlement
    - settlement.delivering_agent
    - confirmation.actual_settlement_date
    - confirmation.settled_quantity
    - confirmation.settled_amount
    - confirmation.settlement_result
  MT546:
    - direction
    - payment_type
    - sender_reference
    - related_reference
    - security.identifier
    - account.safekeeping_account
    - settlement.place_of_settlement
    - settlement.receiving_agent
    - confirmation.actual_settlement_date
    - confirmation.settled_quantity
    - confirmation.settlement_result
  MT547:
    - direction
    - payment_type
    - sender_reference
    - related_reference
    - security.identifier
    - account.safekeeping_account
    - settlement.currency
    - settlement.place_of_settlement
    - settlement.receiving_agent
    - confirmation.actual_settlement_date
    - confirmation.settled_quantity
    - confirmation.settled_amount
    - confirmation.settlement_result
  MT548:
    - sender_reference
    - related_reference
    - status.category
    - status.code
    - status.reason_code
    - status.related_instruction_message_type
  MT564: []
  MT565: []
  MT566: []
  MT567: []
  MT568: []
clientRequiredFields:
  MT530: []
  MT537: []
  MT540: []
  MT541: []
  MT542: []
  MT543: []
  MT544: []
  MT545: []
  MT546: []
  MT547: []
  MT548: []
  MT564: []
  MT565: []
  MT566: []
  MT567: []
  MT568: []
enabledNegativeMutations:
  - MISSING_SETTLEMENT_AMOUNT
  - SETTLEMENT_DATE_BEFORE_TRADE_DATE
  - SENDER_REFERENCE_TOO_LONG
  - MISSING_PLACE_OF_SETTLEMENT
  - UNSUPPORTED_CURRENCY
  - MISSING_PREVIOUS_REFERENCE_FOR_CANCELLATION
  - CONFIRMATION_QUANTITY_EXCEEDS_INSTRUCTION
  - CONFIRMATION_MESSAGE_TYPE_MISMATCH
  - MT548_MISSING_RELATED_REFERENCE
  - INVALID_STATUS_REASON_COMBINATION
validation:
  senderReference:
    maxLength: 16
    uppercase: true

# Configured FIN interface values. Every value below is supplied by whoever configures
# this profile, so the studio classifies them as PROFILE_CONFIGURED. Session and sequence
# numbers are ordinarily allocated by the messaging interface; the values here are
# configured test-interface values. Trailer fields are intentionally empty: MAC, CHK, PDE
# and authentication trailers are interface or network generated and are never invented.
finEnvelope:
  senderLogicalTerminal: DEMOGB2LAXXX
  receiverAddress: DEMOUS33XXXX
  applicationId: F
  serviceId: "01"
  sessionNumber: "0001"
  sequenceNumber: "000001"
  priority: "N"
  includeMessageUserReference: true
  trailerFields: {}

# Configured ISO 20022 header and transport values. `wrapperElement` is the element that
# carries the AppHdr and the Document together. It is a client or market convention rather
# than part of ISO 20022, which is why it is configured here rather than assumed.
mxEnvelope:
  fromBic: DEMOGB2LXXX
  toBic: DEMOUS33XXX
  businessService: swift.demo.subset
  priority: NORM
  wrapperElement: BusinessMessage
