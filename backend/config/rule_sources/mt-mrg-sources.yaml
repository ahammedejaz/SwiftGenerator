# SWIFT MyStandards MT Message Reference Guides — the two the Phase 5B proof reads.
#
# Each entry names a guide, the release it states, the message it describes and the SHA-256
# of the exact bytes the derived rule candidates were read from. Since the universal
# completion engagement the guides live in the repository's own knowledge base
# (`swiftKnowledgeBase/MT/`, carried through Git LFS for this internal project); the drop
# directory (`MT_MRG_SOURCE_DIRECTORY`, default `swiftKnowledgeBase/`) is that folder and
# `sourceLocation` is the path inside it. The corpus-wide reading of every guide needs no
# entry here: `python -m app.rule_engine mrg-corpus` identifies each guide from its cover.
#
# `sourceChecksum` is the point of the file. If a guide is re-exported, corrected or
# swapped, the digest stops matching and ingestion refuses rather than deriving rules from
# bytes nobody reviewed. See docs/mt-real-semantic-phase-05b.md.
#
# Redistribution and external model processing are both withheld on purpose. The guides'
# own Legal Notices restrict disclosure outside the licensee's organisation, so the
# conservative defaults are the accurate ones: no excerpt is committed, and no segment is
# sent to any model provider. Changing either flag is an operator decision about their own
# licence, never a convenience for this tooling.

